services:
  dbs:
    build:
      context: ./docker/router
      dockerfile: Dockerfile
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - SQLD_NODE=${SQLD_NODE:-primary}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/var/lib/sqld
    configs:
      - source: config_json
        target: /etc/sqld/config.json
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8080').then(r => r.status === 404 ? process.exit(0) : process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    stop_grace_period: 1s
    depends_on:
      dbs:
        condition: service_healthy
    environment:
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./data:/var/lib/sqld:ro
      - ./backups:/backups
    configs:
      - source: config_json
        target: /etc/sqld/config.json
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tunnel:
    build:
      context: ./docker/tunnel
      dockerfile: Dockerfile
    user: "${PUID:-1000}:${PGID:-1000}"
    image: tcpexposer
    restart: always
    depends_on:
      dbs:
        condition: service_healthy
    environment:
      - SUBDOMAIN=${SUBDOMAIN}
      - TCPEXPOSER_USERNAME=${TCPEXPOSER_USERNAME}
    secrets:
      - source: ssh_key
        target: /ssh-keys/id_rsa
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    command: >
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o PasswordAuthentication=no
      -i /ssh-keys/id_rsa
      -R ${SUBDOMAIN}:80:dbs:8081
      ${TCPEXPOSER_USERNAME}@tcpexposer.com

configs:
  config_json:
    file: ./config.json

secrets:
  ssh_key:
    file: ~/.ssh/${SSH_SECRET_KEY_FILENAME:-id_rsa}
