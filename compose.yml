services:
  dbs:
    build:
      context: ./docker/router
      dockerfile: Dockerfile
    environment:
      - SQLD_NODE=${SQLD_NODE:-primary}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/var/lib/sqld
      - ./config.json:/var/lib/sqld/config.json:ro
    restart: always

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 1s
    depends_on:
      - dbs
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./data:/var/lib/sqld:ro
      - ./config.json:/var/lib/sqld/config.json:ro
      - ./backups:/backups

  tunnel:
    build:
      context: ./docker/tunnel
      dockerfile: Dockerfile
    image: tcpexposer
    restart: always
    depends_on:
      - dbs
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SSH_SECRET_KEY_FILENAME=${SSH_SECRET_KEY_FILENAME}
      - SUBDOMAIN=${SUBDOMAIN}
      - TCPEXPOSER_USERNAME=${TCPEXPOSER_USERNAME}
    volumes:
      - ~/.ssh:/ssh-keys:ro
    command: >
      -o StrictHostKeyChecking=no
      -i /ssh-keys/${SSH_SECRET_KEY_FILENAME}
      -R ${SUBDOMAIN}:80:dbs:8081
      ${TCPEXPOSER_USERNAME}@tcpexposer.com
